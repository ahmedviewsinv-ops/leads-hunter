<title>Mirage Leads Hunter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar with the logo and page links | one page at a time (dashboard, hunt, leads, WhatsApp, email), routed by the URL hash. Dark glass, RTL for Arabic and LTR for English. */
:root {
  --bg: #060b1c;
  --glass: rgba(18, 30, 68, 0.58);
  --line: rgba(124, 154, 255, 0.17);
  --fg: #e9eeff;
  --muted: #8d9ac5;
  --accent: #3b7bff;
  --accent-2: #7a5cff;
  --cyan: #4fd8ff;
  --good: #34d399;
  --warn: #fbbf24;
  --crit: #fb7185;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Readex Pro", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(59, 123, 255, 0.28), transparent 60%),
    radial-gradient(700px 420px at 0% 100%, rgba(122, 92, 255, 0.2), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
select option { background: #0e1838; color: #e9eeff; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.app {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  gap: 20px;
  max-width: 1480px;
  margin: 0 auto;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 16px;
  backdrop-filter: blur(14px);
  box-shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  min-width: 0;
}
.pad { padding: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 600; letter-spacing: 0; }
h2 { font-size: 16px; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; text-align: left; }

/* sidebar */
.sidebar {
  position: sticky; top: 16px; align-self: start;
  display: flex; flex-direction: column; gap: 14px;
  padding: 18px 14px; height: calc(100vh - 32px); max-height: 780px;
}
.logo-wrap { display: grid; place-items: center; padding: 2px 2px 12px; border-bottom: 1px solid var(--line); }
.logo-img { width: 100%; max-width: 200px; max-height: 110px; object-fit: contain; background: none; border: 0; filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.45)) drop-shadow(0 4px 14px rgba(79, 216, 255, 0.22)); }
.logo-text { font-family: var(--font-display); font-weight: 700; font-size: 30px; background: linear-gradient(90deg, var(--cyan), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted);
  text-decoration: none; border: 1px solid transparent; font-weight: 500;
}
.nav a:hover { color: var(--fg); background: rgba(255, 255, 255, 0.06); }
.nav a[aria-current="page"] { color: #fff; background: rgba(59, 123, 255, 0.26); border-color: rgba(100, 150, 255, 0.5); }
.nav svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }

/* top bar of a page */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.topbar h1 { font-size: 24px; font-weight: 700; }
.topbar .muted { font-size: 13px; }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge {
  font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(251, 191, 36, 0.4);
  color: var(--warn); background: rgba(251, 191, 36, 0.08); text-align: center;
}
.badge.live { border-color: rgba(52, 211, 153, 0.45); color: var(--good); background: rgba(52, 211, 153, 0.08); }
.page { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi .v { font-family: var(--font-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.quick { display: flex; gap: 10px; flex-wrap: wrap; }

/* forms */
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-width: 0; }
.field > label, .lbl { font-size: 12px; color: var(--muted); }
.in {
  background: rgba(6, 12, 34, 0.65); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea.in { resize: vertical; min-height: 76px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--muted);
}
.chip[aria-pressed="true"] { color: #fff; background: rgba(59, 123, 255, 0.32); border-color: rgba(100, 150, 255, 0.65); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; color: var(--muted); font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: rgba(59, 123, 255, 0.35); color: #fff; }
.switch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.btn {
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 8px 14px; font-size: 13px; color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: rgba(255, 255, 255, 0.1); }
.btn.primary { background: linear-gradient(135deg, var(--accent), #4f63ff); border-color: rgba(140, 175, 255, 0.5); font-weight: 600; box-shadow: 0 8px 22px -10px rgba(59, 123, 255, 0.9); }
.btn.wa { background: rgba(37, 211, 102, 0.16); border-color: rgba(37, 211, 102, 0.5); color: #8ff0b4; }
.btn.mail { background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.45); color: #fcd34d; }
.btn.xl { background: rgba(52, 211, 153, 0.14); border-color: rgba(52, 211, 153, 0.5); color: #86efac; }
.btn.danger { border-color: rgba(251, 113, 133, 0.55); color: var(--crit); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.run { background: rgba(6, 12, 34, 0.5); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--cyan)); transition: width 0.2s; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); }
.log { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); min-height: 76px; display: flex; flex-direction: column; gap: 2px; direction: ltr; text-align: left; overflow: hidden; }
.log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log .ok { color: var(--good); }
.log .bad { color: var(--crit); }
.hint { font-size: 12px; color: var(--muted); }
.warnbox { font-size: 12.5px; color: #fde68a; background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.3); border-radius: 12px; padding: 10px 12px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* connection cards */
.cpill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 4px 12px; font-size: 13px; border: 1px solid var(--line); }
.cpill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.c-off { color: var(--muted); }
.c-starting, .c-qr { color: var(--warn); border-color: rgba(251, 191, 36, 0.45); background: rgba(251, 191, 36, 0.08); }
.c-connected { color: var(--good); border-color: rgba(52, 211, 153, 0.5); background: rgba(52, 211, 153, 0.1); }
.c-error { color: var(--crit); border-color: rgba(251, 113, 133, 0.5); background: rgba(251, 113, 133, 0.08); }
.acct { font-family: var(--font-mono); font-size: 22px; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.qrbox { display: grid; place-items: center; min-height: 230px; background: #fff; border-radius: 14px; padding: 12px; width: 100%; max-width: 280px; color: #1b2440; text-align: center; font-size: 13px; }
.qrbox img { width: 100%; height: auto; image-rendering: pixelated; }
.steps { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
.lock { opacity: 0.45; pointer-events: none; }

/* leads table */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 0; }
.tab {
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); border-radius: 12px 12px 0 0; padding: 8px 14px; color: var(--muted); font-size: 13px;
}
.tab[aria-selected="true"] { color: #fff; background: rgba(59, 123, 255, 0.22); border-color: rgba(100, 150, 255, 0.55); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px 16px 6px; }
.tools .in { width: auto; flex: 1 1 170px; }
.tools select.in { flex: 0 1 190px; }
.tablewrap { overflow-x: auto; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th { text-align: start; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid rgba(124, 154, 255, 0.09); vertical-align: middle; font-size: 13px; }
tr.sel td { background: rgba(59, 123, 255, 0.09); }
td input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.co { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; background: linear-gradient(135deg, #2a4aa8, #5b3fc9); }
.co small { display: block; color: var(--muted); font-size: 11.5px; }
.score { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.score .bar { flex: 1; height: 6px; }
.score b { font-variant-numeric: tabular-nums; font-size: 12px; width: 22px; }
.pill { border-radius: 999px; padding: 2px 10px; font-size: 12px; border: 1px solid; background: transparent; white-space: nowrap; }
.s-new { color: var(--cyan); border-color: rgba(79, 216, 255, 0.45); background: rgba(79, 216, 255, 0.08); }
.s-contacted { color: var(--warn); border-color: rgba(251, 191, 36, 0.45); background: rgba(251, 191, 36, 0.08); }
.s-qualified { color: var(--good); border-color: rgba(52, 211, 153, 0.45); background: rgba(52, 211, 153, 0.08); }
.s-demo { color: #b9a5ff; border-color: rgba(122, 92, 255, 0.55); background: rgba(122, 92, 255, 0.14); }
.s-optout { color: var(--crit); border-color: rgba(251, 113, 133, 0.45); background: rgba(251, 113, 133, 0.08); }
.src { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); }
.src.maps { color: #86efac; border-color: rgba(52, 211, 153, 0.4); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px 16px; }
.pager { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pager button { min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); font-variant-numeric: tabular-nums; }
.pager button[aria-current="true"] { background: var(--accent); border-color: transparent; color: #fff; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* dashboard cards */
.donut-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
.donut { position: relative; width: 150px; height: 150px; flex: none; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .c b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.donut .c span { font-size: 11px; color: var(--muted); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; flex: 1; min-width: 120px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.legend em { margin-inline-start: auto; font-style: normal; font-variant-numeric: tabular-nums; color: var(--muted); }
.hot { display: flex; flex-direction: column; gap: 10px; }
.hot-i { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.hot-i b { font-weight: 600; }
.hot-i .bar { grid-column: 1 / -1; height: 5px; }
.hot-i small { color: var(--muted); font-size: 11.5px; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.tl li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; }
.tl li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 6px; box-shadow: 0 0 10px var(--accent); }
.tl small { color: var(--muted); display: block; }
.kw { display: flex; flex-direction: column; gap: 12px; }
.kw-i { display: grid; grid-template-columns: 1fr auto; gap: 4px; font-size: 13px; }
.kw-i .bar { grid-column: 1 / -1; height: 6px; }
.kw-i span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: rgba(14, 24, 56, 0.96); border: 1px solid rgba(100, 150, 255, 0.5); border-radius: 12px; padding: 10px 16px; z-index: 20; font-size: 13px; max-width: calc(100vw - 32px);
}

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: static; height: auto; max-height: none; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 10px; }
  .logo-wrap { border: 0; padding: 0; }
  .logo-img { max-width: 120px; max-height: 56px; }
  .nav { flex-direction: row; overflow-x: auto; max-width: 100%; flex: 1 1 100%; order: 3; }
  .nav a { padding: 8px 10px; flex: none; }
  .side-foot { margin: 0 0 0 auto; flex-direction: row; align-items: center; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .grid2, .row2, .row3 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="app">
  <aside class="sidebar glass">
    <div class="logo-wrap"><img class="logo-img" src="/logo.png" alt="Mirage"></div>
    <nav class="nav" aria-label="Pages">
      <a href="#dashboard" data-pg="dashboard"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/></svg><span data-i18n="nav_dashboard"></span></a>
      <a href="#hunt" data-pg="hunt"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span data-i18n="nav_hunt"></span></a>
      <a href="#leads" data-pg="leads"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.4 2.9-5 5.5-5s4.9 1.6 5.5 5"/><path d="M16 5.2a3 3 0 010 5.6M18 14.3c1.7.6 2.7 2.2 3 4.7"/></svg><span data-i18n="nav_leads"></span></a>
      <a href="#whatsapp" data-pg="whatsapp"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4A8 8 0 1112 20a8 8 0 01-3.8-1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.3-1.8-1-.9.7a4 4 0 01-1.7-1.7l.7-.9-1-1.8z"/></svg><span data-i18n="nav_whatsapp"></span></a>
      <a href="#email" data-pg="email"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg><span data-i18n="nav_email"></span></a>
    </nav>
    <div class="side-foot">
      <button class="btn sm" id="langBtn" type="button" aria-label="Language"></button>
      <span class="badge" id="modeBadge"></span>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div><h1 id="pgTitle"></h1><div class="muted" id="pgSub"></div></div>
      <div class="top-r" id="batchBox">
        <label class="hint" for="fBatch" data-i18n="batch_label"></label>
        <select class="in" id="fBatch" style="width:auto; max-width:260px"></select>
      </div>
    </header>

    <!-- ============ dashboard ============ -->
    <section class="page" id="p-dashboard">
      <div class="kpis" id="kpis"></div>
      <div class="quick">
        <a class="btn primary" href="#hunt" data-i18n="q_hunt"></a>
        <a class="btn" href="#leads" data-i18n="q_leads"></a>
        <a class="btn wa" href="#whatsapp" data-i18n="q_wa"></a>
        <a class="btn mail" href="#email" data-i18n="q_mail"></a>
      </div>
      <div class="grid3">
        <div class="glass pad">
          <div class="card-h"><h2 data-i18n="country_title"></h2></div>
          <div class="donut-wrap">
            <div class="donut"><svg viewBox="0 0 120 120" id="donut" aria-hidden="true"></svg><div class="c"><b id="dPct">0%</b><span id="dName"></span></div></div>
            <ul class="legend" id="legend"></ul>
          </div>
        </div>
        <div class="glass pad">
          <div class="card-h"><h2 data-i18n="hot_title"></h2><span class="hint" data-i18n="hot_hint"></span></div>
          <div class="hot" id="hot"></div>
        </div>
        <div class="glass pad">
          <div class="card-h"><h2 data-i18n="source_title"></h2></div>
          <div class="kw" id="srcBars"></div>
        </div>
      </div>
      <div class="grid2">
        <div class="glass pad">
          <div class="card-h"><h2 data-i18n="act_title"></h2></div>
          <ul class="tl" id="tl"></ul>
        </div>
        <div class="glass pad">
          <div class="card-h"><h2 data-i18n="kwbars_title"></h2></div>
          <div class="kw" id="kwBars"></div>
        </div>
      </div>
    </section>

    <!-- ============ hunt ============ -->
    <section class="page" id="p-hunt" hidden>
      <div class="glass pad split">
        <div>
          <div class="card-h"><h2 data-i18n="hunt_title"></h2></div>
          <div class="field">
            <label for="kw" data-i18n="kw_label"></label>
            <textarea class="in" id="kw"></textarea>
          </div>
          <div class="field">
            <span class="lbl" data-i18n="countries_label"></span>
            <div class="chips" id="countryChips"></div>
            <div style="display:flex; gap:6px; margin-top:4px">
              <input class="in" id="customCountry" data-ph="custom_ph" style="flex:1">
              <button class="btn" id="addCountry" type="button" data-i18n="add"></button>
            </div>
          </div>
          <div class="field">
            <span class="lbl" data-i18n="sources_label"></span>
            <div class="chips" id="sourceChips"></div>
            <div class="hint" id="mapsHint"></div>

  }

  /* ================= export ================= */
  function exportSource() { return state.sel.size ? state.leads.filter(function (l) { return state.sel.has(l.id); }) : filtered(); }
  function csv() {
    var src = exportSource(), cols = FIELDS.filter(function (f) { return state.fields.has(f); });
    var rows = [cols.concat(["country", "source", "score", "status"]).join(",")];
    src.forEach(function (l) { rows.push(cols.map(function (c) { return '"' + String(l[c] || "").replace(/"/g, '""') + '"'; }).concat([cname(l.country), l.source || "web", l.score, l.status]).join(",")); });
    return { text: rows.join("\n"), n: src.length };
  }
  function exportXlsx() {
    var src = exportSource(); if (!src.length) return toast(t("zero_results"));
    if (!state.live) { var r = src.map(function (l) { return [coName(l), l.phone, l.email, l.website, cityName(l), cname(l.country), l.score, stLabel(l.status), l.source || "web"].join("\t"); }); return copy(r.join("\n"), t("t_xlsx_demo")); }
    jpost("/api/export.xlsx", { ids: src.map(sidOf), lang: lang }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || r.status); });
      return r.blob();
    }).then(function (b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "mirage-leads.xlsx"; document.body.appendChild(a); a.click(); a.remove();
      toast(t("t_xlsx_ok", src.length));
    }).catch(function (e) { toast(t("t_xlsx_fail", e.message)); });
  }

  /* ================= hunt ================= */
  function logLine(text, cls) { var el = document.createElement("div"); if (cls) el.className = cls; el.textContent = text; var lg = $("log"); lg.appendChild(el); while (lg.children.length > 5) lg.removeChild(lg.firstChild); }
  function setProgress(p) { $("pbi").style.width = p + "%"; $("pb").setAttribute("aria-valuenow", Math.round(p)); }
  function finish(msg) {
    state.running = false; clearInterval(state.timer); $("startBtn").disabled = false; $("stopBtn").disabled = true;
    logLine(msg, "ok"); renderData();
    var n = state.leads.filter(function (l) { return l.batch === state.curBatch; }).length;
    addAct("a_finished", [], "", null, "a_finished_s", [n]);
  }
  function newBatch(id, codes) { var b = { id: id, name: stamp(codes), scanned: 0 }; state.batches.push(b); state.batchSel = id; state.curBatch = id; state.sel.clear(); state.page = 1; state.tab = "all"; state.fCountry = "all"; state.fSource = "all"; return b; }
  function startDemo(target, kws, codes) {
    var b = newBatch(++state.batchSeq, codes), step = Math.max(8, Math.round(target / 70)), done = 0, cap = Math.min(70, Math.round(target / 12));
    state.timer = setInterval(function () {
      done = Math.min(target, done + step); b.scanned = done;
      var code = pick(codes), kw = pick(kws);
      logLine(t("l_scan", pick(BASES)[2] + "-" + code.toLowerCase() + rnd(90) + ".example"), "");
      if (cap > 0 && Math.random() < 0.6) { var l = mkLead(code, kw, b.id); l.source = state.sources.has("maps") && (!state.sources.has("web") || Math.random() > 0.5) ? "maps" : "web"; state.leads.unshift(l); cap--; logLine(t("l_found", l.phone, coName(l)), "ok"); }
      setProgress(done / target * 100); renderData();
      if (done >= target) finish(t("l_done_demo"));
    }, 130);
  }
  function startLive(target, kws, codes) {
    var custom = {}; codes.forEach(function (c) { if (c.charAt(0) === "X") custom[c] = COUNTRIES[c].n; });
    var body = { keywords: kws, countries: codes, custom: custom, sources: Array.from(state.sources), lang: $("lang").value, target: target, widen: $("widen").checked, skip_known: $("skipKnown").checked, unlimited_pages: $("unlimited").checked, fields: Array.from(state.fields) };
    jpost("/api/jobs", body).then(function (r) { return r.json(); })
      .then(function (j) {
        state.jobId = j.id; var b = newBatch(j.batch, codes), since = 0; renderData();
        state.timer = setInterval(function () {
          fetch(state.api + "/api/jobs/" + j.id + "?since=" + since).then(function (r) { return r.json(); }).then(function (s) {
            since = s.next;
            (s.leads || []).forEach(function (l) { l.sid = l.id; l.id = state.nextId++; state.leads.unshift(l); });
            (s.log || []).forEach(function (x) { logLine(x, ""); });
            b.scanned = s.scanned; setProgress(Math.min(100, (s.found || 0) / target * 100)); renderData();
            if (s.status !== "running") finish(s.status === "done" ? t("l_complete") : t("l_ended"));
          }).catch(function () { finish(t("l_lost")); });
        }, 1200);
      }).catch(function () { finish(t("l_fail")); });
  }
  function start() {
    var kws = $("kw").value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean), codes = Array.from(state.chosen);
    if (!kws.length) return toast(t("t_need_kw"));
    if (!codes.length) return toast(t("t_need_country"));
    if (!state.sources.size) return toast(t("t_need_source"));
    var target = Math.max(10, parseInt($("maxSites").value, 10) || 1000);
    state.running = true; $("startBtn").disabled = true; $("stopBtn").disabled = false; setProgress(0);
    $("log").innerHTML = ""; logLine(t("l_start", kws.length, codes.length), "ok");
    addAct("a_started", [], "", codes);
    if (state.live) startLive(target, kws, codes); else startDemo(target, kws, codes);
  }

  /* ================= WhatsApp account + sender ================= */
  function waMarkSent(phone) { state.leads.forEach(function (l) { if (digits(l.phone) === String(phone) && l.status === "new") l.status = "contacted"; }); }
  function waConnect() {
    var w = state.wa;
    if (state.live) { w.conn = "starting"; w.note = ""; renderWa(); jpost("/api/wa/connect").catch(function () { w.conn = "error"; w.note = t("t_lost"); renderWa(); }); return; }
    w.conn = "starting"; renderWa();
    setTimeout(function () { w.conn = "connected"; w.account = "201000000000"; addAct("a_connected", [], "+" + w.account); renderData(); }, 1600);
  }
  function waDisconnect(logout) {
    var w = state.wa;
    if (state.live) jpost(logout ? "/api/wa/logout" : "/api/wa/disconnect").catch(function () {});
    clearInterval(w.timer); w.running = false; w.conn = "off"; w.account = ""; w.qr = ""; w.status = "idle"; renderWa();
  }
  function waStart() {
    var w = state.wa;
    if (w.running) return toast(t("t_busy"));
    if (w.conn !== "connected") return toast(t("t_need_conn"));
    var msg = $("waText").value.trim(), list = audience("wa");
    if (!msg) return toast(t("t_need_msg"));
    if (!list.length) return toast(t("t_no_recipients"));
    w.running = true; w.sent = 0; w.failed = 0; w.total = list.length; w.status = "sending"; w.log = []; w.since = 0; w.current = ""; w.snote = "";
    addAct("a_wa", [], "", null, "a_wa_s", [list.length]); renderWa();
    if (state.live) {
      jpost("/api/wa/start", { ids: list.map(sidOf), message: msg, min_delay: +$("waMin").value, max_delay: +$("waMax").value, daily_cap: +$("waCap").value, batch_size: +$("waBatch").value, batch_pause: +$("waPause").value })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) { if (!res.ok) { w.running = false; w.status = "idle"; renderWa(); toast(res.j.error === "not_connected" ? t("t_need_conn") : res.j.error === "busy" ? t("t_busy") : t("t_no_recipients")); } })
        .catch(function () { w.running = false; w.status = "error"; w.snote = t("t_lost"); renderWa(); });
    } else {
      var i = 0; clearInterval(w.timer);
      w.timer = setInterval(function () {
        if (i >= list.length) { w.status = "done"; w.running = false; clearInterval(w.timer); renderData(); return; }
        var l = list[i++], ok = Math.random() > 0.08; w.current = l.phone;
        if (ok) { w.sent++; if (l.status === "new") l.status = "contacted"; } else w.failed++;
        w.log.push({ phone: digits(l.phone), ok: ok, note: ok ? "" : "number not on WhatsApp" }); w.status = "sending"; renderData();
      }, 500);
    }
  }
  function waStop() { var w = state.wa; if (state.live) jpost("/api/wa/stop").catch(function () {}); else { w.status = "stopped"; w.running = false; clearInterval(w.timer); } renderWa(); }
  function waPoll() {
    if (!state.live) return;
    var w = state.wa;
    fetch(state.api + "/api/wa/state?since=" + w.since).then(function (r) { return r.json(); }).then(function (s) {
      w.conn = s.conn; w.account = s.account || ""; w.qr = s.qr || ""; w.note = s.note || "";
      w.status = s.status; w.sent = s.sent; w.failed = s.failed; w.total = s.total; w.current = s.current; w.snote = s.snote || "";
      w.nextAt = Date.now() + (s.next_in || 0) * 1000; w.since = s.next; w.running = s.status === "sending" || s.status === "waiting";
      var changed = false;
      (s.entries || []).forEach(function (e) { w.log.push(e); if (e.ok) { waMarkSent(e.phone); changed = true; } });
      if (changed) renderData(); else renderWa();
    }).catch(function () {});
  }

  /* ================= Email settings + sender ================= */
  function readMailForm() {
    return { host: $("mHost").value.trim(), port: +$("mPort").value || 587, security: $("mSec").value, user: $("mUser").value.trim(), password: $("mPass").value,
      from_name: $("mFromName").value.trim(), from_email: $("mFromEmail").value.trim(), reply_to: $("mReply").value.trim(), footer: $("mFooter").value.trim() };
  }
  function fillMailForm(c) {
    if (c.host != null) $("mHost").value = c.host; if (c.port) $("mPort").value = c.port; if (c.security) $("mSec").value = c.security;
    if (c.user != null) $("mUser").value = c.user; if (c.from_name != null) $("mFromName").value = c.from_name;
    if (c.from_email != null) $("mFromEmail").value = c.from_email; if (c.reply_to != null) $("mReply").value = c.reply_to;
    if (c.footer) $("mFooter").value = c.footer;
  }
  function saveMail() {
    var c = readMailForm(), m = state.mail;
    if (c.footer === "") { c.footer = FOOT_DEF[lang]; $("mFooter").value = c.footer; }
    if (!state.live) { m.cfg = c; m.hasPass = m.hasPass || !!c.password; $("mPass").value = ""; $("mMsg").textContent = t("m_saved"); renderMail(); return; }
    jpost("/api/email/settings", c).then(function (r) { return r.json(); }).then(function (j) {
      m.cfg = j.settings; m.hasPass = !!j.settings.has_password; $("mPass").value = ""; $("mMsg").textContent = t("m_saved"); renderMail();
    }).catch(function () { $("mMsg").textContent = t("t_lost"); });
  }
  function testMail() {
    var to = $("mTestTo").value.trim();
    if (!state.live) { $("mMsg").textContent = t("m_test_ok") + " (demo)"; return; }
    $("mMsg").textContent = "...";
    jpost("/api/email/test", { to: to }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (res) {
      $("mMsg").textContent = res.ok ? t("m_test_ok") : t("m_test_fail", res.j.error || "");
    }).catch(function () { $("mMsg").textContent = t("t_lost"); });
  }
  function mailStart() {
    var m = state.mail;
    if (m.running) return toast(t("t_busy"));
    if (!(m.hasPass && m.cfg.host)) return toast(t("t_need_smtp"));
    var subject = $("mSubject").value.trim(), body = $("mBody").value.trim(), list = audience("mail");
    if (!subject || !body) return toast(t("t_need_subject"));
    if (!list.length) return toast(t("t_no_recipients"));
    m.running = true; m.sent = 0; m.failed = 0; m.total = list.length; m.status = "sending"; m.log = []; m.since = 0; m.current = ""; m.note = "";
    addAct("a_mail", [], "", null, "a_mail_s", [list.length]); renderMail();
    if (state.live) {
      jpost("/api/email/start", { ids: list.map(sidOf), subject: subject, body: body, skip_sent: $("mSkip").checked, min_delay: +$("mMin").value, max_delay: +$("mMax").value, daily_cap: +$("mCap").value, batch_size: +$("mBatch").value, batch_pause: +$("mPause").value })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) { if (!res.ok) { m.running = false; m.status = "idle"; renderMail(); toast(res.j.error === "smtp_not_set" ? t("t_need_smtp") : res.j.error === "busy" ? t("t_busy") : t("t_no_recipients")); } else mailPoll(); })
        .catch(function () { m.running = false; m.status = "error"; m.note = t("t_lost"); renderMail(); });
    } else {
      var i = 0; clearInterval(m.timer);
      m.timer = setInterval(function () {
        if (i >= list.length) { m.status = "done"; m.running = false; clearInterval(m.timer); renderData(); return; }
        var l = list[i++]; m.current = l.email; m.sent++; if (l.status === "new") l.status = "contacted";
        m.log.push({ email: l.email, ok: true, note: "" }); m.status = "sending"; renderData();
      }, 400);
    }
  }
  function mailPoll() {
    var m = state.mail; clearInterval(m.timer);
    m.timer = setInterval(function () {
      fetch(state.api + "/api/email/state?since=" + m.since).then(function (r) { return r.json(); }).then(function (s) {
        m.status = s.status; m.sent = s.sent; m.failed = s.failed; m.total = s.total; m.current = s.current; m.note = s.note || "";
        m.nextAt = Date.now() + (s.next_in || 0) * 1000; m.since = s.next; m.running = s.status === "sending" || s.status === "waiting";
        (s.entries || []).forEach(function (e) { m.log.push(e); if (e.ok) state.leads.forEach(function (l) { if ((l.email || "").toLowerCase() === e.email && l.status === "new") l.status = "contacted"; }); });
        renderData(); if (!m.running) clearInterval(m.timer);
      }).catch(function () { m.running = false; clearInterval(m.timer); });
    }, 1500);
  }
  function mailStop() { var m = state.mail; if (state.live) jpost("/api/email/stop").catch(function () {}); else { m.status = "stopped"; m.running = false; clearInterval(m.timer); } renderMail(); }

  /* ================= events ================= */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("button"); if (!el) return;
    if (el.dataset.c) { var c = el.dataset.c; if (state.chosen.has(c)) state.chosen.delete(c); else state.chosen.add(c); renderChips(); }
    else if (el.dataset.f) { var f = el.dataset.f; if (f === "phone") return toast(t("t_phone_fixed")); if (state.fields.has(f)) state.fields.delete(f); else state.fields.add(f); renderChips(); }
    else if (el.dataset.src) { var sc = el.dataset.src; if (state.sources.has(sc)) state.sources.delete(sc); else state.sources.add(sc); renderChips(); }
    else if (el.dataset.m) { state.mode = el.dataset.m; renderChips(); }
    else if (el.dataset.tab) { state.tab = el.dataset.tab; state.page = 1; renderTabs(); renderTable(); renderWa(); renderMail(); }
    else if (el.dataset.page) { state.page = +el.dataset.page; renderTable(); }
    else if (el.dataset.cycle) {
      var l = state.leads.filter(function (x) { return x.id === +el.dataset.cycle; })[0]; var ns = ORDER[(ORDER.indexOf(l.status) + 1) % ORDER.length];
      setStatus([l], ns); addAct("a_status", ["@st_" + ns], coName(l)); renderData();
    }
    else if (el.dataset.viewb) { state.batchSel = +el.dataset.viewb; state.sel.clear(); state.page = 1; state.fCountry = "all"; renderData(); location.hash = "leads"; }
    else if (el.dataset.delb) {
      var id = +el.dataset.delb;
      if (state.delArm !== id) { state.delArm = id; renderHistory(); setTimeout(function () { if (state.delArm === id) { state.delArm = null; renderHistory(); } }, 3000); return; }
      state.delArm = null;
      if (state.live) fetch(state.api + "/api/batches/" + id, { method: "DELETE" }).catch(function () {});
      state.leads = state.leads.filter(function (x) { return x.batch !== id; }); state.batches = state.batches.filter(function (x) { return x.id !== id; });
      state.sel.clear(); if (state.batchSel === id) state.batchSel = "all"; toast(t("t_batch_deleted")); renderData();
    }
    else if (el.id === "csvBtn") { var r = csv(); copy(r.text, t("t_csv", r.n)); }
    else if (el.id === "xlsBtn") exportXlsx();
    else if (el.id === "toWa") { location.hash = "whatsapp"; }
    else if (el.id === "toMail") { location.hash = "email"; }
    else if (el.id === "startBtn") start();
    else if (el.id === "stopBtn") { if (state.live && state.jobId) jpost("/api/jobs/" + state.jobId + "/stop").catch(function () {}); finish(t("l_stopped")); }
    else if (el.id === "addCountry") { var v = $("customCountry").value.trim(); if (!v) return; var k = "X" + v.slice(0, 3); COUNTRIES[k] = { n: v, e: v, dial: "···", pre: ["00"], cities: [[v, v]] }; state.chosen.add(k); $("customCountry").value = ""; renderChips(); }
    else if (el.id === "selAll") {
      var list = filtered(), all = list.length && list.every(function (x) { return state.sel.has(x.id); });
      list.forEach(function (x) { if (all) state.sel.delete(x.id); else state.sel.add(x.id); }); renderTable(); renderWa(); renderMail();
    }
    else if (el.id === "applyBulk") {
      var st = $("bulkStatus").value, ss = state.leads.filter(function (x) { return state.sel.has(x.id); });
      if (!ss.length) return toast(t("t_select_first")); if (!st) return toast(t("t_pick_status"));
      setStatus(ss, st); addAct("a_marked", [ss.length], "", null, "st_" + st); toast(t("t_marked", ss.length)); renderData();
    }
    else if (el.id === "waConnect") waConnect();
    else if (el.id === "waDisc") waDisconnect(false);
    else if (el.id === "waSwitch") waDisconnect(true);
    else if (el.id === "waStart") waStart();
    else if (el.id === "waStop") waStop();
    else if (el.id === "mSave") saveMail();
    else if (el.id === "mTest") testMail();
    else if (el.id === "mStart") mailStart();
    else if (el.id === "mStop") mailStop();
    else if (el.id === "langBtn") applyLang(lang === "ar" ? "en" : "ar");
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset.sel) { var id = +el.dataset.sel; if (el.checked) state.sel.add(id); else state.sel.delete(id); renderTable(); renderWa(); renderMail(); }
    else if (el.id === "fCountry") { state.fCountry = el.value; state.page = 1; renderTable(); renderWa(); renderMail(); }
    else if (el.id === "fSource") { state.fSource = el.value; state.page = 1; renderTable(); renderWa(); renderMail(); }
    else if (el.id === "fBatch") { state.batchSel = el.value === "all" ? "all" : +el.value; state.sel.clear(); state.page = 1; state.fCountry = "all"; renderData(); }
    else if (el.id === "perPage") { state.per = +el.value; state.page = 1; renderTable(); }
    else if (el.id === "widen") renderChips();
    else if (el.id === "waSkip") renderWa();
    else if (el.id === "mPreset") {
      var P = { gmail: ["smtp.gmail.com", 587, "starttls"], outlook: ["smtp.office365.com", 587, "starttls"], zoho: ["smtp.zoho.com", 587, "starttls"] }[el.value];
      if (P) { $("mHost").value = P[0]; $("mPort").value = P[1]; $("mSec").value = P[2]; }
    }
  });
  $("q").addEventListener("input", function (e) { state.q = e.target.value; state.page = 1; renderTable(); renderWa(); renderMail(); });
  $("kw").addEventListener("input", renderChips);
  window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
  setInterval(function () { if (state.wa.status === "waiting") renderWa(); if (state.mail.status === "waiting") renderMail(); }, 1000);
  setInterval(waPoll, 2000);

  /* logo: own file first, then the Mirage site, then a text mark */
  Array.prototype.forEach.call(document.querySelectorAll(".logo-img"), function (img) {
    img.addEventListener("error", function () {
      if (!img.dataset.f) { img.dataset.f = "1"; img.src = "https://www.mirageemarketing.com/logo.png"; }
      else { var s = document.createElement("span"); s.className = "logo-text"; s.textContent = "Mirage"; img.replaceWith(s); }
    });
  });

  /* ================= boot: use the backend when it answers, otherwise stay in demo mode ================= */
  var saved = null; try { saved = localStorage.getItem("mirage-lang"); } catch (e) {}
  seed(); $("perPage").value = "25"; applyLang(saved === "en" ? "en" : "ar");
  try {
    fetch("/api/health").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.ok) return;
      state.live = true; state.mapsEngine = j.maps || ""; state.leads = []; state.batches = []; state.activity = [];
      $("modeBadge").className = "badge live"; $("modeBadge").textContent = t("badge_live");
      return Promise.all([fetch("/api/batches").then(function (r) { return r.json(); }), fetch("/api/leads").then(function (r) { return r.json(); }), fetch("/api/email/settings").then(function (r) { return r.json(); })]).then(function (res) {
        res[0].forEach(function (b) { state.batches.push({ id: b.id, name: b.name, scanned: b.scanned || 0 }); });
        res[1].forEach(function (l) { l.sid = l.id; l.id = state.nextId++; state.leads.push(l); });
        var top = state.batches.slice().sort(function (a, b) { return b.id - a.id; })[0]; state.batchSel = top ? top.id : "all";
        var cfg = res[2].settings || {}; state.mail.cfg = cfg; state.mail.hasPass = !!cfg.has_password; fillMailForm(cfg);
        renderAll(); waPoll();
      });
    }).catch(function () {});
  } catch (e) {}
})();
</script>
